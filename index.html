<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUST مركز تراست | رقم 1 في مصر لصيانة الأجهزة المنزلية</title>
<meta name="description" content="مركز تراست رقم 1 في مصر لصيانة الأجهزة المنزلية - غسالات، ثلاجات، تكييفات، بوتاجازات، سخانات. فنيون متخصصون وضمان على أعمال الصيانة في الإسكندرية.">
<meta name="keywords" content="صيانة أجهزة منزلية, الإسكندرية, غسالات, ثلاجات, تكييفات, مركز تراست, رقم 1 في مصر">
<meta property="og:title" content="TRUST مركز تراست | رقم 1 في مصر">
<meta property="og:description" content="قبل ما تحتار... كلم تراست وخد القرار">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/* ==================== VARIABLES ==================== */
:root{
  /* خلفيات فاتحة جديدة */
  --bg:#f7f8fc;
  --bg-2:#eef2f9;
  --bg-3:#ffffff;
  --bg-soft:#e8eef7;
  
  /* الألوان الأساسية */
  --navy:#0f2447;
  --navy-2:#1a3566;
  --navy-soft:#e8eef7;
  
  --red:#c8102e;
  --red-dark:#9b0d23;
  --red-bright:#e01a35;
  
  --gold:#d4a017;
  --gold-2:#f0b400;
  --gold-soft:#fef4dc;
  
  --white:#ffffff;
  --text:#0f2447;
  --text-2:#4a5b7a;
  --text-3:#8592ab;
  --border:#e2e8f2;
  
  --wa:#25D366;
  --radius:14px;
  --shadow-sm:0 4px 16px rgba(15,36,71,.06);
  --shadow:0 12px 40px rgba(15,36,71,.1);
  --shadow-lg:0 24px 60px rgba(15,36,71,.15);
  --glow-red:0 8px 30px rgba(200,16,46,.25);
  --glow-gold:0 8px 30px rgba(212,160,23,.3);
}

/* ==================== RESET ==================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  line-height:1.7;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* ==================== UTILITIES ==================== */
.container{max-width:1280px;margin:0 auto;padding:0 24px}
.section{padding:100px 0;position:relative}
.section-title{
  font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:900;
  text-align:center;
  margin-bottom:14px;
  line-height:1.3;
  color:var(--navy);
  font-family:'Tajawal',sans-serif;
}
.section-title .accent{color:var(--red)}
.section-sub{
  text-align:center;
  color:var(--text-2);
  font-size:1.05rem;
  max-width:680px;
  margin:0 auto 55px;
}
.divider{
  width:80px;height:4px;
  background:linear-gradient(90deg,var(--red),var(--gold));
  margin:0 auto 22px;
  border-radius:2px;
}

/* ==================== BUTTONS ==================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 32px;
  border-radius:50px;
  font-weight:700;
  font-size:1rem;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
  white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(135deg,var(--red),var(--red-bright));
  color:var(--white);
  box-shadow:var(--glow-red);
}
.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(200,16,46,.4);
}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:var(--navy);
  box-shadow:var(--glow-gold);
  font-weight:800;
}
.btn-gold:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(212,160,23,.5);
}
.btn-wa{
  background:linear-gradient(135deg,#1eb254,var(--wa));
  color:var(--white);
  box-shadow:0 8px 24px rgba(37,211,102,.3);
}
.btn-wa:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 40px rgba(37,211,102,.5);
}
.btn-outline{
  background:transparent;
  border:2px solid var(--navy);
  color:var(--navy);
}
.btn-outline:hover{
  background:var(--navy);
  color:var(--white);
  transform:translateY(-3px);
}
.btn svg{width:20px;height:20px;flex-shrink:0}

/* ==================== HEADER ==================== */
.header{
  position:fixed;top:0;left:0;right:0;
  z-index:1000;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  transition:all .3s;
}
.header.scrolled{
  background:rgba(255,255,255,.98);
  box-shadow:0 4px 30px rgba(15,36,71,.08);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  max-width:1400px;margin:0 auto;
  gap:20px;
}

/* LOGO */
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo-mark{
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-trust{
  font-family:'Anton',sans-serif;
  font-weight:400;
  font-size:1.85rem;
  letter-spacing:2px;
  display:flex;
  line-height:1;
}
.logo-trust .t{color:var(--red)}
.logo-trust .r{color:var(--red)}
.logo-trust .u{color:var(--gold);font-style:italic;transform:scaleX(1.05)}
.logo-trust .s{color:var(--red)}
.logo-trust .t2{color:var(--red)}
.logo-sub{
  font-size:.65rem;
  color:var(--text-2);
  font-weight:700;
  letter-spacing:1.5px;
  margin-top:4px;
  font-family:'Tajawal',sans-serif;
}

/* NAV */
.nav{display:flex;align-items:center;gap:6px}
.nav a{
  padding:9px 15px;
  font-size:.92rem;
  font-weight:700;
  color:var(--text-2);
  border-radius:8px;
  transition:all .25s;
  position:relative;
}
.nav a:hover,.nav a.active{color:var(--navy)}
.nav a::after{
  content:'';position:absolute;bottom:3px;right:15px;left:15px;
  height:2px;background:var(--red);
  transform:scaleX(0);transition:transform .3s;
  border-radius:2px;
}
.nav a:hover::after{transform:scaleX(1)}

/* HEADER CONTACT */
.header-contact{display:flex;align-items:center;gap:10px;flex-shrink:0}
.header-phone{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:50px;
  font-size:.85rem;
  font-weight:800;
  color:var(--navy);
  transition:all .3s;
  direction:ltr;
}
.header-phone:hover{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
  box-shadow:var(--glow-red);
}
.header-phone:hover svg{color:#fff}
.header-phone svg{width:15px;height:15px;color:var(--red)}
.header-wa{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1eb254,var(--wa));
  border-radius:50%;
  transition:all .3s;
  box-shadow:0 4px 14px rgba(37,211,102,.3);
}
.header-wa:hover{transform:scale(1.1);box-shadow:0 8px 24px rgba(37,211,102,.5)}
.header-wa svg{width:20px;height:20px;color:#fff}
.btn-header-order{
  padding:10px 22px;
  background:linear-gradient(135deg,var(--red),var(--red-bright));
  color:#fff;
  border-radius:50px;
  font-weight:800;
  font-size:.9rem;
  transition:all .3s;
  box-shadow:var(--glow-red);
}
.btn-header-order:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(200,16,46,.4)}

/* BURGER */
.burger{
  display:none;
  width:44px;height:44px;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:var(--bg-soft);
  border-radius:10px;
}
.burger span{
  width:22px;height:2px;background:var(--navy);
  border-radius:2px;transition:all .3s;
}
.burger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}

/* MOBILE MENU */
.mobile-menu{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--white);
  z-index:999;
  padding:100px 30px 40px;
  display:flex;flex-direction:column;gap:8px;
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu a{
  padding:18px 20px;
  font-size:1.15rem;
  font-weight:700;
  color:var(--navy);
  border-radius:12px;
  background:var(--bg);
  border:1px solid var(--border);
  transition:all .3s;
}
.mobile-menu a:hover{background:var(--red);color:#fff;border-color:var(--red)}
.mobile-menu .mm-divider{height:1px;background:var(--border);margin:14px 0}
.mobile-menu .mm-phone{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:1.1rem;font-weight:800;
  direction:ltr;
  color:var(--navy);
}
.mobile-menu .mm-wa{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:16px;
  background:linear-gradient(135deg,#1eb254,var(--wa));
  border-radius:12px;
  font-size:1.05rem;font-weight:800;
  color:#fff;
}

/* ==================== HERO ==================== */
.hero{
  min-height:100vh;
  display:flex;align-items:center;
  position:relative;
  padding:140px 0 80px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(200,16,46,.06),transparent 55%),
    radial-gradient(ellipse at 80% 80%,rgba(212,160,23,.08),transparent 55%),
    linear-gradient(160deg,#ffffff 0%,var(--bg) 50%,var(--bg-2) 100%);
}
.hero::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(15,36,71,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,36,71,.03) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
}
.hero-grid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:60px;
  align-items:center;
  position:relative;z-index:2;
}
.hero-content{text-align:right}

/* رقم 1 في مصر - Badge */
.hero-number-one{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 22px;
  background:linear-gradient(135deg,var(--gold-soft),#fff);
  border:2px solid var(--gold);
  border-radius:50px;
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:1rem;
  color:var(--navy);
  margin-bottom:24px;
  box-shadow:0 8px 24px rgba(212,160,23,.2);
  position:relative;
  overflow:hidden;
  opacity:0;animation:fadeUp .8s .05s forwards;
}
.hero-number-one::before{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 3s infinite;
}
.hero-number-one .num{
  font-family:'Anton',sans-serif;
  font-size:1.6rem;
  color:var(--red);
  line-height:1;
  letter-spacing:1px;
  text-shadow:0 2px 8px rgba(200,16,46,.3);
}
.hero-number-one .crown{
  width:22px;height:22px;
  color:var(--gold);
  filter:drop-shadow(0 2px 4px rgba(212,160,23,.5));
}
@keyframes shine{
  0%{left:-100%}
  60%{left:100%}
  100%{left:100%}
}

/* HERO BRAND */
.hero-brand{
  display:flex;align-items:center;gap:20px;
  margin-bottom:24px;
  opacity:0;animation:fadeUp .8s .15s forwards;
}
.hero-logo-mark{
  width:80px;height:80px;
  flex-shrink:0;
  filter:drop-shadow(0 8px 20px rgba(200,16,46,.2));
}
.hero-trust{
  font-family:'Anton',sans-serif;
  font-weight:400;
  font-size:clamp(4rem,11vw,7.5rem);
  line-height:.9;
  letter-spacing:3px;
  display:flex;
}
.hero-trust .t{color:var(--red)}
.hero-trust .r{color:var(--red)}
.hero-trust .u{
  color:var(--gold);
  font-style:italic;
  transform:scaleX(1.06);
  display:inline-block;
}
.hero-trust .s{color:var(--red)}
.hero-trust .t2{color:var(--red)}

.hero-tagline{
  font-family:'Tajawal',sans-serif;
  font-size:clamp(1.4rem,3.2vw,2rem);
  font-weight:900;
  color:var(--navy);
  margin-bottom:8px;
  opacity:0;animation:fadeUp .8s .3s forwards;
}
.hero-tagline .gold{color:var(--gold)}
.hero-service-line{
  font-size:clamp(1rem,2.2vw,1.3rem);
  color:var(--text-2);
  font-weight:600;
  margin-bottom:32px;
  opacity:0;animation:fadeUp .8s .4s forwards;
}
.hero-slogan{
  display:inline-block;
  padding:14px 28px;
  background:linear-gradient(135deg,var(--red),var(--red-bright));
  border-radius:50px;
  font-size:clamp(.95rem,2vw,1.15rem);
  font-weight:800;
  color:#fff;
  margin-bottom:36px;
  opacity:0;animation:fadeUp .8s .5s forwards;
  box-shadow:var(--glow-red);
  position:relative;
}
.hero-slogan::before{
  content:'“';
  font-size:1.6rem;
  color:var(--gold-2);
  margin-left:4px;
}
.hero-slogan::after{
  content:'”';
  font-size:1.6rem;
  color:var(--gold-2);
  margin-right:4px;
}
.hero-buttons{
  display:flex;gap:16px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .8s .6s forwards;
}
.hero-buttons .btn{flex:1;min-width:200px}

/* HERO VISUAL */
.hero-visual{
  position:relative;
  opacity:0;animation:fadeIn 1.1s .5s forwards;
}
.hero-visual-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.hero-card{
  border-radius:18px;
  overflow:hidden;
  position:relative;
  aspect-ratio:1;
  background:var(--bg-2);
  box-shadow:var(--shadow);
  transition:all .5s;
}
.hero-card:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-lg);
}
.hero-card img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s;
}
.hero-card:hover img{transform:scale(1.08)}
.hero-card-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px;
  background:linear-gradient(to top,rgba(15,36,71,.95),transparent);
  color:#fff;
  font-weight:700;
  font-size:.9rem;
  display:flex;align-items:center;gap:8px;
}
.hero-card-label .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px var(--gold);
}
.hero-card.tall{grid-row:span 2}
.hero-card.wide{grid-column:span 2;aspect-ratio:2/1}

/* FLOATING BADGE */
.hero-badge{
  position:absolute;
  top:-16px;left:-16px;
  padding:12px 20px;
  background:linear-gradient(135deg,var(--gold),var(--gold-2));
  color:var(--navy);
  border-radius:14px;
  font-weight:900;
  font-size:.85rem;
  box-shadow:0 12px 30px rgba(212,160,23,.4);
  z-index:3;
  animation:float 3s ease-in-out infinite;
}
.hero-badge-2{
  position:absolute;
  bottom:-14px;right:-14px;
  padding:12px 20px;
  background:linear-gradient(135deg,var(--red),var(--red-bright));
  color:var(--white);
  border-radius:14px;
  font-weight:900;
  font-size:.85rem;
  box-shadow:0 12px 30px rgba(200,16,46,.4);
  z-index:3;
  animation:float 3s ease-in-out infinite .5s;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* ==================== شريط رقم 1 في مصر المتحرك ==================== */
.number-one-bar{
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 50%,var(--navy) 100%);
  padding:16px 0;
  overflow:hidden;
  position:relative;
  border-top:2px solid var(--gold);
  border-bottom:2px solid var(--gold);
}
.number-one-bar::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background-image:
    linear-gradient(90deg,rgba(240,180,0,.05) 1px,transparent 1px);
  background-size:40px 100%;
  opacity:.6;
}
.marquee{
  display:flex;
  gap:60px;
  animation:scroll 30s linear infinite;
  white-space:nowrap;
  position:relative;
}
.marquee-item{
  display:inline-flex;
  align-items:center;
  gap:12px;
  font-family:'Tajawal',sans-serif;
  font-weight:900;
  font-size:1.15rem;
  color:#fff;
  flex-shrink:0;
}
.marquee-item .star{
  color:var(--gold);
  font-size:1.3rem;
}
.marquee-item .num1{
  font-family:'Anton',sans-serif;
  color:var(--gold);
  font-size:1.4rem;
  letter-spacing:1px;
}
@keyframes scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(50%)}
}

/* ==================== QUICK SERVICES ==================== */
.quick-services{
  padding:80px 0 100px;
  background:var(--bg);
}
.qs-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
}
.qs-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  transition:all .4s;
  cursor:pointer;
  position:relative;
  box-shadow:var(--shadow-sm);
}
.qs-card:hover{
  transform:translateY(-8px);
  border-color:var(--gold);
  box-shadow:var(--shadow);
}
.qs-img{
  aspect-ratio:4/3;
  overflow:hidden;
  position:relative;
}
.qs-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s;
}
.qs-card:hover .qs-img img{transform:scale(1.1)}
.qs-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(15,36,71,.3),transparent 60%);
}
.qs-body{
  padding:16px 14px 18px;
  text-align:center;
}
.qs-body h3{
  font-size:1rem;
  font-weight:800;
  margin-bottom:10px;
  color:var(--navy);
  font-family:'Tajawal',sans-serif;
}
.qs-body .qs-btn{
  display:inline-block;
  padding:7px 18px;
  background:var(--red);
  border-radius:50px;
  font-size:.78rem;
  font-weight:700;
  color:#fff;
  transition:all .3s;
}
.qs-card:hover .qs-btn{
  background:var(--gold);
  color:var(--navy);
}

/* ==================== BRANDS ==================== */
.brands-section{
  background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg-soft) 100%);
  position:relative;
}
.brands-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
.brand-card{
  padding:26px 14px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  text-align:center;
  font-family:'Anton',sans-serif;
  font-weight:400;
  font-size:1.15rem;
  letter-spacing:1px;
  color:var(--text-2);
  transition:all .35s;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.brand-card::before{
  content:'';position:absolute;top:0;left:-100%;
  width:100%;height:3px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  transition:left .6s;
}
.brand-card:hover{
  color:var(--red);
  border-color:var(--red);
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}
.brand-card:hover::before{left:100%}

/* ==================== SERVICES ==================== */
.services-section{background:var(--bg)}
.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}
.service-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;

  position:relative;

  overflow:hidden;
  position:relative;
}

  color:var(--red);
  font-weight:700;
  font-size:.9rem;

.service-link:hover{gap:14px}
.service-link svg{width:16px;height:16px;transform:rotate(180deg)}

  box-shadow:var(--shadow-sm);
