<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TRUST | مركز تراست لصيانة الأجهزة المنزلية في الإسكندرية</title>
    <meta name="description" content="مركز تراست لصيانة الأجهزة المنزلية في الإسكندرية. صيانة الغسالات والثلاجات والتكييفات والبوتاجازات والسخانات لمختلف الماركات. اطلب الصيانة الآن.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #102A43;
            --navy-light: #1a3a5c;
            --red: #C62828;
            --red-dark: #a02020;
            --gold: #D9A441;
            --gold-light: #e8c06a;
            --off-white: #F7F5F0;
            --white: #FFFFFF;
            --gray: #e8e6e1;
            --text-dark: #1a1a1a;
            --text-medium: #4a4a4a;
            --text-light: #7a7a7a;
            --shadow-sm: 0 1px 3px rgba(16, 42, 67, 0.06);
            --shadow-md: 0 4px 20px rgba(16, 42, 67, 0.08);
            --shadow-lg: 0 10px 40px rgba(16, 42, 67, 0.12);
            --shadow-xl: 0 20px 60px rgba(16, 42, 67, 0.15);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--off-white);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ===== TRUST LOGO STYLES ===== */
        .trust-logo {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: -0.03em;
            font-size: 2.2rem;
            line-height: 1;
            transform: skewX(-4deg);
            user-select: none;
        }

        .trust-logo .t1,
        .trust-logo .r1,
        .trust-logo .s1,
        .trust-logo .t2 {
            color: var(--red);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
        }

        .trust-logo .u1 {
            color: var(--gold);
            position: relative;
            display: inline-block;
            transform: skewX(8deg) translateY(-1px);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        }

        .trust-logo .u1::after {
            content: '';
            position: absolute;
            bottom: -4px;
            right: 0;
            width: 80%;
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
            opacity: 0.4;
        }

        .trust-logo-sm {
            font-size: 1.6rem;
        }

        .trust-logo-lg {
            font-size: 4.5rem;
        }

        .trust-logo-xl {
            font-size: 6rem;
        }

        @media (max-width: 768px) {
            .trust-logo {
                font-size: 1.7rem;
            }
            .trust-logo-lg {
                font-size: 3rem;
            }
            .trust-logo-xl {
                font-size: 3.8rem;
            }
            .trust-logo-sm {
                font-size: 1.4rem;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulseGold {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(217, 164, 65, 0.4);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(217, 164, 65, 0);
            }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--navy);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .header.scrolled {
            box-shadow: var(--shadow-lg);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            gap: 16px;
        }

        .header-logo {
            flex-shrink: 0;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
        }

        .header-nav a {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            transition: var(--transition);
            white-space: nowrap;
        }

        .header-nav a:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.08);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .header-phone {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .header-phone a {
            color: var(--white);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            direction: ltr;
        }

        .header-phone a:hover {
            color: var(--gold);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            white-space: nowrap;
            border: 2px solid transparent;
        }

        .btn-primary {
            background: var(--red);
            color: var(--white);
            border-color: var(--red);
        }

        .btn-primary:hover {
            background: var(--red-dark);
            border-color: var(--red-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(198, 40, 40, 0.35);
        }

        .btn-whatsapp {
            background: #25D366;
            color: var(--white);
            border-color: #25D366;
        }

        .btn-whatsapp:hover {
            background: #1da851;
            border-color: #1da851;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .btn-gold {
            background: var(--gold);
            color: var(--navy);
            border-color: var(--gold);
            font-weight: 700;
        }

        .btn-gold:hover {
            background: var(--gold-light);
            border-color: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(217, 164, 65, 0.35);
        }

        .btn-lg {
            padding: 16px 36px;
            font-size: 1.05rem;
            border-radius: 14px;
        }

        .btn-block {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .mobile-menu-btn span {
            display: block;
            width: 24px;
            height: 2.5px;
            background: var(--white);
            border-radius: 2px;
            transition: var(--transition);
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .mobile-nav {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100vh;
            background: var(--navy);
            z-index: 999;
            padding: 100px 30px 40px;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            transition: var(--transition);
        }

        .mobile-nav.open {
            display: flex;
        }

        .mobile-nav a {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 18px;
            border-radius: 10px;
            transition: var(--transition);
        }

        .mobile-nav a:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
        }

        .mobile-nav .mobile-actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (max-width: 1100px) {
            .header-nav {
                display: none;
            }
            .header-phone {
                display: none;
            }
            .mobile-menu-btn {
                display: flex;
            }
            .header-actions .btn {
                display: none;
            }
            .header-actions .btn-mobile-show {
                display: inline-flex;
            }
        }

        @media (max-width: 600px) {
            .header-actions .btn-mobile-show {
                display: none;
            }
            .header-inner {
                padding: 10px 0;
            }
        }

        /* ===== MARQUEE BAR ===== */
        .marquee-bar {
            background: var(--red);
            color: var(--white);
            padding: 14px 0;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 30s linear infinite;
        }

        .marquee-content {
            display: flex;
            align-items: center;
            gap: 60px;
            padding: 0 30px;
            white-space: nowrap;
            font-size: 1rem;
            font-weight: 600;
        }

        .marquee-content .dot {
            color: var(--gold);
            font-size: 1.4rem;
        }

        .marquee-content .phone {
            direction: ltr;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }

        @media (max-width: 768px) {
            .marquee-content {
                font-size: 0.85rem;
                gap: 40px;
            }
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            background: var(--navy);
            color: var(--white);
            padding: 80px 0 100px;
            overflow: hidden;
            min-height: 85vh;
            display: flex;
            align-items: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(217, 164, 65, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 60%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(198, 40, 40, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            animation: fadeInUp 0.8s ease forwards;
        }

        .hero-logo-wrap {
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
            color: var(--white);
        }

        .hero-tagline {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 12px;
            position: relative;
            display: inline-block;
        }

        .hero-tagline::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to left, var(--gold), transparent);
            border-radius: 2px;
        }

        .hero-desc {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
            line-height: 1.8;
            max-width: 520px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            animation: fadeInUp 1s ease 0.2s forwards;
            opacity: 0;
        }

        .hero-img-card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            position: relative;
            aspect-ratio: 4/3;
            background: var(--navy-light);
        }

        .hero-img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .hero-img-card:hover img {
            transform: scale(1.08);
        }

        .hero-img-card:nth-child(1) {
            animation: float 6s ease-in-out infinite;
        }

        .hero-img-card:nth-child(2) {
            animation: float 6s ease-in-out 0.5s infinite;
        }

        .hero-img-card:nth-child(3) {
            animation: float 6s ease-in-out 1s infinite;
        }

        .hero-img-card:nth-child(4) {
            animation: float 6s ease-in-out 1.5s infinite;
        }

        .hero-img-label {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(16, 42, 67, 0.85);
            backdrop-filter: blur(8px);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 992px) {
            .hero-inner {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .hero-title {
                font-size: 2.8rem;
            }
            .hero-images {
                grid-template-columns: 1fr 1fr;
                max-width: 500px;
            }
        }

        @media (max-width: 576px) {
            .hero {
                padding: 50px 0 70px;
                min-height: auto;
            }
            .hero-title {
                font-size: 2rem;
            }
            .hero-tagline {
                font-size: 1.15rem;
            }
            .hero-desc {
                font-size: 1rem;
            }
            .hero-buttons {
                flex-direction: column;
            }
            .hero-buttons .btn {
                width: 100%;
            }
            .hero-images {
                gap: 10px;
            }
        }

        /* ===== SECTION STYLES ===== */
        .section {
            padding: 90px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-label {
            display: inline-block;
            background: rgba(198, 40, 40, 0.08);
            color: var(--red);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .section-subtitle {
            font-size: 1.1rem;
            color: var(--text-medium);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .section {
                padding: 60px 0;
            }
            .section-title {
                font-size: 1.8rem;
            }
            .section-subtitle {
                font-size: 1rem;
            }
        }

        /* ===== SERVICES ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .service-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1px solid rgba(16, 42, 67, 0.06);
            display: flex;
            flex-direction: column;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: rgba(198, 40, 40, 0.15);
        }

        .service-card-img {
            height: 220px;
            overflow: hidden;
            position: relative;
            background: var(--gray);
        }

        .service-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .service-card:hover .service-card-img img {
            transform: scale(1.1);
        }

        .service-card-body {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .service-card-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .service-card-body p {
            font-size: 0.95rem;
            color: var(--text-medium);
            margin-bottom: 20px;
            flex: 1;
            line-height: 1.7;
        }

        .service-card .btn {
            align-self: flex-start;
        }

        @media (max-width: 992px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .services-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== BRANDS ===== */
        .brands-section {
            background: var(--white);
        }

        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .brand-card {
            background: var(--off-white);
            border: 1px solid rgba(16, 42, 67, 0.08);
            border-radius: var(--radius);
            padding: 24px 16px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--navy);
            transition: var(--transition);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .brand-card:hover {
            background: var(--navy);
            color: var(--white);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--navy);
        }

        .brand-card:nth-child(odd) {
            background: var(--off-white);
        }

        .brand-card:nth-child(odd):hover {
            background: var(--navy);
            color: var(--white);
        }

        @media (max-width: 480px) {
            .brands-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .brand-card {
                font-size: 0.85rem;
                padding: 16px 10px;
                min-height: 65px;
            }
        }

        /* ===== WHY TRUST ===== */
        .why-section {
            background: var(--off-white);
        }

        .why-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .why-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1px solid rgba(16, 42, 67, 0.06);
            position: relative;
            overflow: hidden;
        }

        .why-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to left, var(--red), var(--gold));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .why-card:hover::before {
            transform: scaleX(1);
        }

        .why-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .why-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(16, 42, 67, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.6rem;
            color: var(--navy);
            transition: var(--transition);
        }

        .why-card:hover .why-icon {
            background: var(--navy);
            color: var(--gold);
            transform: scale(1.1);
        }

        .why-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .why-card p {
            font-size: 0.9rem;
            color: var(--text-medium);
            line-height: 1.7;
        }

        @media (max-width: 992px) {
            .why-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
